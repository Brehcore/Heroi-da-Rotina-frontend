<div class="home-page">
	<app-navbar></app-navbar>

	<div class="content">
		<!-- Mensagem de Erro -->
		<div *ngIf="error" class="error-banner">
			<span>{{ error }}</span>
			<button (click)="error = null" class="close-btn">&times;</button>
		</div>
		
		<!-- Mensagem de Sucesso (Pop-up 2s) -->
		<div *ngIf="successMsg" class="success-banner">
			<span>{{ successMsg }}</span>
		</div>

		<div class="subtitle-area">
			<button class="change-family-btn" (click)="changeFamilyNavigation()">Mudar Família</button>
			<p class="subtitle">Tarefas aguardando aprovação</p>
		</div>

		<div *ngIf="loading" class="loading-state">
			Carregando tarefas...
		</div>

		<div *ngIf="!loading && pendingTasks.length === 0" class="empty-state">
			Nenhuma tarefa aguardando aprovação no momento.
		</div>

		<div class="tasks-list" *ngIf="pendingTasks.length > 0">
			<div class="task-card pending" *ngFor="let task of pendingTasks">
				<div class="task-header">
					<div class="task-title">{{ task.title }}</div>
					<div class="task-status pending">{{ task.minorName }}</div>
				</div>

				<div class="task-description">{{ task.description }}</div>

				<div class="task-footer">
					<div class="task-reward">
						<span class="reward-label">Recompensa:</span>
						<span class="reward-value">{{ task.rewardTask }} tokens</span>
					</div>
					<button class="btn-approve" (click)="approveTask(task.id)" [disabled]="loading">
						✓ Aprovar
					</button>
			</div>
		</div>
	</div>
</div>
