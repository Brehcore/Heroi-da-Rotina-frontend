<div class="login-page">
    <div class="login-card">
        <div class="login-left">
            <img src="/Login.png" alt="Ilustração família" />
        </div>

        <div class="login-right">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                    <img src="/Logo-transp.png" alt="Logo Herói da Rotina" class="logo" />
                <h1 class="title">Herói da Rotina</h1>

                <label>E-mail</label>
                <div class="field">
                    <input type="email" formControlName="email" placeholder="Informe seu e-mail" required />
                </div>

                <label>Senha</label>
                <div class="field">
                    <input type="password" formControlName="password" placeholder="Informe sua senha" required />
                </div>

                <button type="submit" class="btn" [disabled]="loginForm.invalid">Entrar</button>

                <div class="alt-links">
                    <span>ou</span>
                    <a class="create-account" routerLink="/register">Criar uma Conta</a>
                </div>
            </form>
        </div>
    </div>
</div>
