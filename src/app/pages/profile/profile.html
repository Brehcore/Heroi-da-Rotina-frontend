<div class="profile-page">
  <app-navbar></app-navbar>
  
  <div class="content">
    <div class="profile-card">
      <div *ngIf="loading" class="loading">Carregando perfil...</div>
      <div *ngIf="error" class="error">{{ error }}</div>
  
      <div *ngIf="!loading && user" class="profile-content">
        <div class="avatar-container">
          <img [src]="user.profilePictureUrl" [alt]="'Foto de ' + user.name" title="Foto de perfil do usuário" class="avatar" />
        </div>
        <h1 class="name">{{ user.name }}</h1>
        <p class="email">{{ user.email }}</p>
  
        <div class="info-group">
          <span class="label">Papel:</span>
          <span class="value">{{ user.role }}</span>
        </div>
  
        <div class="info-group" *ngIf="user.familyName">
          <span class="label">Família:</span>
          <span class="value">{{ user.familyName }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
