<div class="members-page">
  <app-navbar></app-navbar>

  <div class="content">
    <!-- Error message -->
    <div *ngIf="error" class="error-banner">
      <span>{{ error }}</span>
      <button (click)="error = null" class="close-btn">&times;</button>
    </div>

    <!-- Create Family Section -->
    <!-- Removed: Form moved to profile modal -->

    <!-- Members Section -->
    <div class="members-section">
      <div class="members-header">
        <h2>Membros da Família</h2>
        <button class="btn-add-member" (click)="toggleCreateUserForm()" [disabled]="loading">
          + Adicionar Membro
        </button>
      </div>

      <!-- Create User Form Modal -->
      <div *ngIf="showCreateUserForm" class="create-user-modal-overlay" (click)="closeCreateUserForm()">
        <div class="create-user-modal" (click)="$event.stopPropagation()">
          <div class="modal-header">
            <h3>Adicionar Novo Membro</h3>
            <button class="close-btn" (click)="closeCreateUserForm()" [disabled]="loading">&times;</button>
          </div>

          <div class="modal-content">
            <app-avatar-selector 
              [initialRole]="'MINOR'"
              (avatarSelected)="onAvatarSelected($event)">
            </app-avatar-selector>
          </div>
        </div>
      </div>

      <div *ngIf="loading && members.length === 0" class="loading-state">
        Carregando membros...
      </div>

      <div *ngIf="!loading && members.length === 0" class="empty-state">
        Nenhum membro encontrado na família.
      </div>

      <div class="members-grid" *ngIf="members.length > 0">
        <!-- Card para MONITOR (não clicável) -->
        <div class="member-card" 
          *ngFor="let member of members" 
          [style.cursor]="member.role === 'MONITOR' ? 'default' : 'pointer'"
          [routerLink]="member.role !== 'MONITOR' ? ['/minor'] : null"
          [queryParams]="member.role !== 'MONITOR' ? { minorId: member.id, minorName: member.name } : null">
          <div class="card-top">
            <div class="card-title">{{ member.name }}</div>
            <div class="card-role">
              <ng-container *ngIf="member.role === 'MONITOR'">
                <svg class="role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                Monitor
              </ng-container>
              <ng-container *ngIf="member.role !== 'MONITOR'">
                <svg class="role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Menor
              </ng-container>
            </div>
          </div>

          <div class="avatar-wrap">
            <div class="avatar-circle">
              <img 
                *ngIf="member.avatarUrl" 
                [src]="member.avatarUrl" 
                [alt]="member.name" 
                title="{{ member.name }}"
                class="avatar-image"
              />
              <svg 
                *ngIf="!member.avatarUrl" 
                class="avatar-icon" 
                viewBox="0 0 24 24" 
                fill="currentColor"
              >
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
          </div>

          <div class="card-info">
            <div class="info-item">
              <span class="label">Email:</span>
              <span class="value">{{ member.email }}</span>
            </div>
            <div class="info-item">
              <span class="label">Família:</span>
              <span class="value">{{ member.familyName }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
