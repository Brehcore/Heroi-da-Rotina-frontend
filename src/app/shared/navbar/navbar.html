      </li>
      <li>

          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <span class="nav-text">Membros</span>
        </a>
      </li>
      <li>
        <a routerLink="/tasks" routerLinkActive="active" title="Tarefas">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
          <span class="nav-text">Tarefas</span>
        </a>
      </li>
      <li>
        <a routerLink="/screentime" routerLinkActive="active" title="Tempo de Tela">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
          <span class="nav-text">Telas</span>
        </a>
      </li>
      <li>
        <a routerLink="/wallet" routerLinkActive="active" title="Carteira">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>

    </ul>
  </nav>

  <div class="profile-area">
    <!-- Notificações (Sininho) -->
    <div class="notification-container" *ngIf="userRole === 'MONITOR'">
      <button class="notification-btn" (click)="toggleNotifications()" title="Notificações">
        <svg class="notification-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <span class="badge" *ngIf="pendingScreenTimeRequests.length > 0">{{ pendingScreenTimeRequests.length }}</span>
      </button>
    </div>

    <button class="profile-btn" title="Abrir menu de perfil" (click)="toggleProfileMenu()">
      <ng-container *ngIf="userProfilePictureUrl; else noPic">
        <img
          [src]="userProfilePictureUrl"
          alt="Perfil do usuário"
          title="Foto do perfil"
          class="profile-picture"
        />
      </ng-container>
      <ng-template #noPic>
        <svg class="profile-placeholder" viewBox="0 0 24 24" fill="currentColor" width="24" height="24" aria-hidden="true">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </ng-template>
    </button>
  </div>
</div>

<!-- Notification Dropdown -->
<div class="notification-overlay" *ngIf="showNotifications" (click)="toggleNotifications()">
  <div class="notification-dropdown" *ngIf="showNotifications" (click)="$event.stopPropagation()">
    <div class="notification-header">Solicitações de Tela</div>
    <div class="notification-list">
      <div class="notification-item" *ngIf="pendingScreenTimeRequests.length === 0">
        Nenhuma solicitação no momento.
      </div>
      <div class="notification-item" *ngFor="let req of pendingScreenTimeRequests">
        <div class="notif-info">
          <strong>{{ req.minorName }}</strong> pediu <strong>{{ req.requestedMinutes }} min</strong>
          <span class="notif-time">{{ getElapsedTime(req) }}</span>
        </div>
        <div class="notif-actions">
          <button class="btn-approve-sm" (click)="approveScreenTime(req.requestId)" [disabled]="isProcessingNotif" title="Aprovar">✓</button>
          <button class="btn-reject-sm" (click)="rejectScreenTime(req.requestId)" [disabled]="isProcessingNotif" title="Recusar">✗</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Profile modal -->
<div class="profile-modal-overlay" *ngIf="showProfileMenu" (click)="closeProfileMenu()">
  <div class="profile-modal" (click)="$event.stopPropagation()">
    <!-- Profile Header -->
    <div class="profile-modal-header">
      <img 
        *ngIf="userProfilePictureUrl" 
        [src]="userProfilePictureUrl" 
        alt="Foto do usuário"
        title="Seu perfil"
        class="profile-modal-image"
      />
      <svg 
        *ngIf="!userProfilePictureUrl" 
        class="profile-modal-icon" 
        viewBox="0 0 24 24" 
        fill="currentColor"
      >
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <p class="profile-modal-name">{{ getUserName() }}</p>
    </div>
    <ul>
      <li (click)="openConfigs()">Configurações</li>
      <li routerLink="/family-selection" (click)="closeProfileMenu()">Selecionar família</li>
      <li (click)="toggleCreateFamilyForm()" class="create-family-option">Criar Família</li>

      <!-- Create Family Form Inside Modal -->
      <li *ngIf="showCreateFamilyForm" class="create-family-form-modal">
        <form class="family-form" (ngSubmit)="onCreateFamily()">
          <input type="text" placeholder="Nome da família" [(ngModel)]="familyNameInput" name="familyName" class="family-input" [disabled]="loading" autofocus />
          <div class="form-actions">
            <button type="submit" class="btn-confirm" [disabled]="loading || !familyNameInput.trim()">{{ loading ? '...' : 'OK' }}</button>
            <button type="button" class="btn-cancel" (click)="closeCreateFamilyForm()" [disabled]="loading">Cancelar</button>
          </div>
        </form>
      </li>

      <li class="danger" (click)="logout()">Sair</li>
    </ul>
  </div>
</div>
